# Shopify-authored shim: makes the carried (unmodified) demo_common package from
# Anthropic's commerce-agents examples installable, so `pip install -e ./vendor`
# replaces PYTHONPATH juggling. See NOTICE.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-agents-demo-common"
version = "0.0.0"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["demo_common"]
